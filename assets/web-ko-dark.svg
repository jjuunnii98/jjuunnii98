<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="316" viewBox="0 0 1280 316" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', Arial, sans-serif"><rect x="0.5" y="0.5" width="415.0" height="149.0" rx="14" fill="#10141D" stroke="#2A3242"/><g transform="translate(30.0,28)" fill="none" stroke="#8DB6FF" color="#8DB6FF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="9"/><path d="M1 10h18"/><path d="M10 1c2.6 2.6 3.8 5.6 3.8 9s-1.2 6.4-3.8 9c-2.6-2.6-3.8-5.6-3.8-9S7.4 3.6 10 1z"/></g><text x="62.0" y="44" font-size="18.5" font-weight="600" letter-spacing="-0.3" fill="#F5F7FB">3개 언어</text><text x="30.0" y="88" font-size="16" fill="#CDD4E1">한국어·영어·일본어</text><text x="30.0" y="116" font-size="16" fill="#CDD4E1">일본어 줄바꿈과 글꼴 따로 맞춤</text><rect x="432.5" y="0.5" width="415.0" height="149.0" rx="14" fill="#10141D" stroke="#2A3242"/><g transform="translate(462.0,28)" fill="none" stroke="#8DB6FF" color="#8DB6FF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="1" width="12" height="18" rx="3"/><line x1="8" y1="15.5" x2="12" y2="15.5"/></g><text x="494.0" y="44" font-size="18.5" font-weight="600" letter-spacing="-0.3" fill="#F5F7FB">날봄 소개</text><text x="462.0" y="88" font-size="16" fill="#CDD4E1">실제 앱 화면, 라이트·다크</text><text x="462.0" y="116" font-size="16" fill="#CDD4E1">요금표와 자주 묻는 질문</text><rect x="864.5" y="0.5" width="415.0" height="149.0" rx="14" fill="#10141D" stroke="#2A3242"/><g transform="translate(894.0,28)" fill="none" stroke="#8DB6FF" color="#8DB6FF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 1h8l4 4v14H4z"/><path d="M12 1v4h4"/><line x1="7" y1="10" x2="13" y2="10"/><line x1="7" y1="14" x2="13" y2="14"/></g><text x="926.0" y="44" font-size="18.5" font-weight="600" letter-spacing="-0.3" fill="#F5F7FB">앱에 맞춘 법적 문서</text><text x="894.0" y="88" font-size="16" fill="#CDD4E1">방침·약관을 3개 언어로</text><text x="894.0" y="116" font-size="16" fill="#CDD4E1">앱 빌드마다 함께 고침</text><rect x="0.5" y="166.5" width="415.0" height="149.0" rx="14" fill="#10141D" stroke="#2A3242"/><g transform="translate(30.0,194)" fill="none" stroke="#8DB6FF" color="#8DB6FF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="9" width="14" height="10" rx="3"/><path d="M6 9V6a4 4 0 0 1 8 0v3"/><circle cx="10" cy="14" r="1.2" fill="currentColor"/></g><text x="62.0" y="210" font-size="18.5" font-weight="600" letter-spacing="-0.3" fill="#F5F7FB">비밀 초대 링크</text><text x="30.0" y="254" font-size="16" fill="#CDD4E1">비밀 열쇠는 브라우저 안에만</text><text x="30.0" y="282" font-size="16" fill="#CDD4E1">분석·입력 폼 없음, 검색 제외</text><rect x="432.5" y="166.5" width="415.0" height="149.0" rx="14" fill="#10141D" stroke="#2A3242"/><g transform="translate(462.0,194)" fill="none" stroke="#8DB6FF" color="#8DB6FF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17C3 8 8 3 17 3c0 9-5 14-14 14z"/><path d="M3 17l8-8"/></g><text x="494.0" y="210" font-size="18.5" font-weight="600" letter-spacing="-0.3" fill="#F5F7FB">작고 조용하게</text><text x="462.0" y="254" font-size="16" fill="#CDD4E1">자체 DB 없음</text><text x="462.0" y="282" font-size="16" fill="#CDD4E1">방문 통계 없음</text><rect x="864.5" y="166.5" width="415.0" height="149.0" rx="14" fill="#10141D" stroke="#2A3242"/><g transform="translate(894.0,194)" fill="none" stroke="#8DB6FF" color="#8DB6FF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="9"/><polyline points="6,10.5 8.8,13.2 14,7.5"/></g><text x="926.0" y="210" font-size="18.5" font-weight="600" letter-spacing="-0.3" fill="#F5F7FB">바꿀 때마다 검사</text><text x="894.0" y="254" font-size="16" fill="#CDD4E1">타입 검사·린트·빌드</text><text x="894.0" y="282" font-size="16" fill="#CDD4E1">CI에서 Lighthouse 기준 검사</text></svg>
