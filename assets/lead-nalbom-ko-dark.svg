<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="232" viewBox="0 0 1280 232" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', Arial, sans-serif"><defs><linearGradient id="cardg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#121828"/><stop offset="1" stop-color="#0C111C"/></linearGradient><linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8DB6FF" stop-opacity="0"/><stop offset="0.25" stop-color="#8DB6FF" stop-opacity="0.9"/><stop offset="0.6" stop-color="#C3A6FF" stop-opacity="0.8"/><stop offset="1" stop-color="#C3A6FF" stop-opacity="0"/></linearGradient><linearGradient id="accg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8DB6FF"/><stop offset="1" stop-color="#C3A6FF"/></linearGradient><linearGradient id="inkg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F5F7FB"/><stop offset="0.7" stop-color="#F5F7FB"/><stop offset="1" stop-color="#8DB6FF"/></linearGradient></defs><rect x="0.5" y="0.5" width="1279.0" height="231.0" rx="14" fill="url(#cardg)" stroke="#263049"/><rect x="20.0" y="0.2" width="520.0" height="1.6" rx="0.8" fill="url(#edge)"/><rect x="32" y="26" width="3" height="52" rx="1.5" fill="url(#accg)"/><text x="50" y="46" font-size="18" font-weight="600" fill="#F5F7FB">날마다 봄, 나를 돌아봄. 거꾸로 읽으면 봄날.</text><text x="50" y="72" font-size="15.5" font-style="italic" fill="#CDD4E1">챙겨야 할 날을 날마다 보고, 하루 한 줄로 나를 돌아보는 달력.</text><text x="32" y="118" font-size="16" fill="#CDD4E1">날봄은 챙겨야 할 날, 캘린더, 하루 메모, 직장인 도구를 한 앱에 담고 홈 화면과 잠금화면에 보여 줍니다.</text><text x="32" y="144" font-size="16" fill="#CDD4E1">아이폰, 아이패드, 맥(Apple 실리콘), 안드로이드에서 쓸 수 있어요.</text><line x1="32" y1="166" x2="1248" y2="166" stroke="#263049"/><text x="32" y="199" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12.5" letter-spacing="2" fill="#A3ADC0">BUILT WITH</text><rect x="150.0" y="180" width="149.8" height="28" rx="8" fill="#8DB6FF" fill-opacity="0.07" stroke="#45516B" stroke-opacity="0.7"/><text x="162.0" y="198.6" font-size="13" fill="#F5F7FB">React Native 0.81</text><rect x="307.8" y="180" width="105.4" height="28" rx="8" fill="#8DB6FF" fill-opacity="0.07" stroke="#45516B" stroke-opacity="0.7"/><text x="319.8" y="198.6" font-size="13" fill="#F5F7FB">Expo SDK 54</text><rect x="421.2" y="180" width="98.0" height="28" rx="8" fill="#8DB6FF" fill-opacity="0.07" stroke="#45516B" stroke-opacity="0.7"/><text x="433.2" y="198.6" font-size="13" fill="#F5F7FB">TypeScript</text><rect x="527.2" y="180" width="68.4" height="28" rx="8" fill="#8DB6FF" fill-opacity="0.07" stroke="#45516B" stroke-opacity="0.7"/><text x="539.2" y="198.6" font-size="13" fill="#F5F7FB">SQLite</text><rect x="603.6" y="180" width="61.0" height="28" rx="8" fill="#8DB6FF" fill-opacity="0.07" stroke="#45516B" stroke-opacity="0.7"/><text x="615.6" y="198.6" font-size="13" fill="#F5F7FB">Swift</text><rect x="672.6" y="180" width="68.4" height="28" rx="8" fill="#8DB6FF" fill-opacity="0.07" stroke="#45516B" stroke-opacity="0.7"/><text x="684.6" y="198.6" font-size="13" fill="#F5F7FB">Kotlin</text><rect x="749.0" y="180" width="83.2" height="28" rx="8" fill="#8DB6FF" fill-opacity="0.07" stroke="#45516B" stroke-opacity="0.7"/><text x="761.0" y="198.6" font-size="13" fill="#F5F7FB">CloudKit</text><rect x="840.2" y="180" width="83.2" height="28" rx="8" fill="#8DB6FF" fill-opacity="0.07" stroke="#45516B" stroke-opacity="0.7"/><text x="852.2" y="198.6" font-size="13" fill="#F5F7FB">Supabase</text><rect x="931.4" y="180" width="98.0" height="28" rx="8" fill="#8DB6FF" fill-opacity="0.07" stroke="#45516B" stroke-opacity="0.7"/><text x="943.4" y="198.6" font-size="13" fill="#F5F7FB">RevenueCat</text><rect x="1037.4" y="180" width="68.4" height="28" rx="8" fill="#8DB6FF" fill-opacity="0.07" stroke="#45516B" stroke-opacity="0.7"/><text x="1049.4" y="198.6" font-size="13" fill="#F5F7FB">Sentry</text></svg>
