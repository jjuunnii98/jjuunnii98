<svg xmlns="http://www.w3.org/2000/svg" width="480" height="423" viewBox="0 0 480 423" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', Arial, sans-serif"><defs><linearGradient id="cardg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#121828"/><stop offset="1" stop-color="#0C111C"/></linearGradient><linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8DB6FF" stop-opacity="0"/><stop offset="0.25" stop-color="#8DB6FF" stop-opacity="0.9"/><stop offset="0.6" stop-color="#C3A6FF" stop-opacity="0.8"/><stop offset="1" stop-color="#C3A6FF" stop-opacity="0"/></linearGradient><linearGradient id="accg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8DB6FF"/><stop offset="1" stop-color="#C3A6FF"/></linearGradient><linearGradient id="inkg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F5F7FB"/><stop offset="0.7" stop-color="#F5F7FB"/><stop offset="1" stop-color="#8DB6FF"/></linearGradient></defs><rect x="0.5" y="0.5" width="479.0" height="422.0" rx="14" fill="url(#cardg)" stroke="#263049"/><rect x="20.0" y="0.2" width="288.0" height="2" rx="1" fill="url(#edge)"/><rect x="28" y="22" width="3" height="71" rx="1.5" fill="url(#accg)"/><text x="44" y="40.0" font-size="17.5" fill="#F5F7FB" font-weight="600" >날마다 봄, 나를 돌아봄. 거꾸로 읽으면 봄날.</text><text x="44" y="65.0" font-size="15" fill="#CDD4E1" font-style="italic" >Seeing your days, looking back on yourself. Read</text><text x="44" y="87.0" font-size="15" fill="#CDD4E1" font-style="italic" >backwards: bomnal, spring days.</text><text x="28" y="133.0" font-size="16" fill="#CDD4E1" >Nalbom puts the dates you care about, your</text><text x="28" y="157.0" font-size="16" fill="#CDD4E1" >calendar, daily notes and everyday work tools into</text><text x="28" y="181.0" font-size="16" fill="#CDD4E1" >one app, and shows them on the home screen and</text><text x="28" y="205.0" font-size="16" fill="#CDD4E1" >lock screen. iPhone, iPad, Mac (Apple silicon) and</text><text x="28" y="229.0" font-size="16" fill="#CDD4E1" >Android.</text><line x1="28" y1="255" x2="452" y2="255" stroke="#263049"/><text x="28" y="285" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" letter-spacing="2" fill="#A3ADC0">BUILT WITH</text><rect x="28.0" y="299" width="142.9" height="28" rx="8" fill="#8DB6FF" fill-opacity="0.07" stroke="#45516B" stroke-opacity="0.7"/><text x="40.0" y="318.0" font-size="13.5" fill="#F5F7FB">React Native 0.81</text><rect x="178.9" y="299" width="110.8" height="28" rx="8" fill="#8DB6FF" fill-opacity="0.07" stroke="#45516B" stroke-opacity="0.7"/><text x="190.9" y="318.0" font-size="13.5" fill="#F5F7FB">Expo SDK 54</text><rect x="297.7" y="299" width="96.2" height="28" rx="8" fill="#8DB6FF" fill-opacity="0.07" stroke="#45516B" stroke-opacity="0.7"/><text x="309.7" y="318.0" font-size="13.5" fill="#F5F7FB">TypeScript</text><rect x="28.0" y="335" width="69.6" height="28" rx="8" fill="#8DB6FF" fill-opacity="0.07" stroke="#45516B" stroke-opacity="0.7"/><text x="40.0" y="354.0" font-size="13.5" fill="#F5F7FB">SQLite</text><rect x="105.6" y="335" width="60.5" height="28" rx="8" fill="#8DB6FF" fill-opacity="0.07" stroke="#45516B" stroke-opacity="0.7"/><text x="117.6" y="354.0" font-size="13.5" fill="#F5F7FB">Swift</text><rect x="174.1" y="335" width="62.2" height="28" rx="8" fill="#8DB6FF" fill-opacity="0.07" stroke="#45516B" stroke-opacity="0.7"/><text x="186.1" y="354.0" font-size="13.5" fill="#F5F7FB">Kotlin</text><rect x="244.3" y="335" width="78.5" height="28" rx="8" fill="#8DB6FF" fill-opacity="0.07" stroke="#45516B" stroke-opacity="0.7"/><text x="256.3" y="354.0" font-size="13.5" fill="#F5F7FB">CloudKit</text><rect x="330.8" y="335" width="83.3" height="28" rx="8" fill="#8DB6FF" fill-opacity="0.07" stroke="#45516B" stroke-opacity="0.7"/><text x="342.8" y="354.0" font-size="13.5" fill="#F5F7FB">Supabase</text><r