<svg xmlns="http://www.w3.org/2000/svg" width="480" height="423" viewBox="0 0 480 423" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', Arial, sans-serif"><defs><linearGradient id="cardg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F3F6FC"/></linearGradient><linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1F5BD0" stop-opacity="0"/><stop offset="0.25" stop-color="#1F5BD0" stop-opacity="0.9"/><stop offset="0.6" stop-color="#6E4BDB" stop-opacity="0.8"/><stop offset="1" stop-color="#6E4BDB" stop-opacity="0"/></linearGradient><linearGradient id="accg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1F5BD0"/><stop offset="1" stop-color="#6E4BDB"/></linearGradient><linearGradient id="inkg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0B1530"/><stop offset="0.7" stop-color="#0B1530"/><stop offset="1" stop-color="#1F5BD0"/></linearGradient><filter id="sh" x="-5%" y="-10%" width="110%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.6" flood-color="#1C2D57" flood-opacity="0.10"/></filter></defs><rect x="3.0" y="1.0" width="474.0" height="416.0" rx="14" fill="url(#cardg)" stroke="#D6DEEB" filter="url(#sh)"/><rect x="23.0" y="1.2" width="288.0" height="2" rx="1" fill="url(#edge)"/><rect x="28" y="22" width="3" height="71" rx="1.5" fill="url(#accg)"/><text x="44" y="40.0" font-size="17.5" fill="#0B1530" font-weight="600" >날마다 봄, 나를 돌아봄. 거꾸로 읽으면 봄날.</text><text x="44" y="65.0" font-size="15" fill="#38445A" font-style="italic" >Seeing your days, looking back on yourself. Read</text><text x="44" y="87.0" font-size="15" fill="#38445A" font-style="italic" >backwards: bomnal, spring days.</text><text x="28" y="133.0" font-size="16" fill="#38445A" >Nalbom puts the dates you care about, your</text><text x="28" y="157.0" font-size="16" fill="#38445A" >calendar, daily notes and everyday work tools into</text><text x="28" y="181.0" font-size="16" fill="#38445A" >one app, and shows them on the home screen and</text><text x="28" y="205.0" font-size="16" fill="#38445A" >lock screen. iPhone, iPad, Mac (Apple silicon) and</text><text x="28" y="229.0" font-size="16" fill="#38445A" >Android.</text><line x1="28" y1="255" x2="452" y2="255" stroke="#D6DEEB"/><text x="28" y="285" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" letter-spacing="2" fill="#5F6B82">BUILT WITH</text><rect x="28.0" y="299" width="142.9" height="28" rx="8" fill="#1F5BD0" fill-opacity="0.07" stroke="#BFC9DB" stroke-opacity="0.7"/><text x="40.0" y="318.0" font-size="13.5" fill="#0B1530">React Native 0.81</text><rect x="178.9" y="299" width="110.8" height="28" rx="8" fill="#1F5BD0" fill-opacity="0.07" stroke="#BFC9DB" stroke-opacity="0.7"/><text x="190.9" y="318.0" font-size="13.5" fill="#0B1530">Expo SDK 54</text><rect x="297.7" y="299" width="96.2" height="28" rx="8" fill="#1F5BD0" fill-opacity="0.07" stroke="#BFC9DB" stroke-opacity="0.7"/><text x="309.7" y="318.0" font-size="13.5" fill="#0B1530">TypeScript</text><rect x="28.0" y="335" width="69.6" height="28" rx="8" fill="#1F5BD0" fill-opacity="0.07" stroke="#BFC9DB" stroke-opacity="0.7"/><text x="40.0" y="354.0" font-size="13.5" fill="#0B1530">SQLite</text><rect x="105.6" y="335" width="60.5" height="28" rx="8" fill="#1F5BD0" fill-opacity="0.07" stroke="#BFC9DB" stroke-opacity="0.7"/><text x="117.6" y="354.0" font-size="13.5" fill="#0B1530">Swift</text><rect x="174.1" y="335" width="62.2" height="28" rx="8" fill="#1F5BD0" fill-opacity="0.07" stroke="#BFC9DB" stroke-opacity="0.7"/><text x="186.1" y="354.0" font-size="13.5" fill="#0B1530">Kotlin</text><rect x="244.3" y="335" width="78.5" height="28" rx="8" fill="#1F5BD0" fill-opacity="0.07" stroke="#BFC9DB" stroke-opacity="0.7"/><text x="256.3" y="354.0" font-size="13.5" fill="#0B1530">CloudKit</text><rect x="330.8" y="335" width="83.3" height="28" rx="8" fill="#1F5BD0" fill-opacity="0.07" stroke="#BFC9DB" stroke-opacity="0.7"/><text x="342.8" y="354.0" font-size="13.5" fill="#0B1530">Supabase</text><rect x="28.0" y="371" width="99.6" height="28" rx="8" fill="#1F5BD0" fill-opacity="0.07" stroke="#BFC9DB" stroke-opacity="0.7"/><text x="40.0" y="390.0" font-size="13.5" fill="#0B1530">RevenueCat</text><rect x="135.6" y="371" width="69.0" height="28" rx="8" fill="#1F5BD0" fill-opacity="0.07" stroke="#BFC9DB" stroke-opacity="0.7"/><text x="147.6" y="390.0" font-size="13.5" fill="#0B1530">Sentry</text></svg>
