<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="318" viewBox="0 0 1280 318" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', Arial, sans-serif"><style>
@keyframes pulse{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:0;transform:scale(2.4)}}
@keyframes drift{0%,100%{opacity:.55}50%{opacity:.9}}
