<svg xmlns="http://www.w3.org/2000/svg" width="480" height="399" viewBox="0 0 480 399" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', Arial, sans-serif"><defs><linearGradient id="cardg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#121828"/><stop offset="1" stop-color="#0C111C"/></linearGradient><linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8DB6FF" stop-opacity="0"/><stop offset="0.25" stop-color="#8DB6FF" stop-opacity="0.9"/><stop offset="0.6" stop-color="#C3A6FF" stop-opacity="0.8"/><stop offset="1" stop-color="#C3A6FF" stop-opacity="0"/></linearGradient><linearGradient id="accg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8DB6FF"/><stop offset="1" stop-color="#C3A6FF"/></linearGradient><linearGradient id="inkg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F5F7FB"/><stop offset="0.7" stop-color="#F5F7FB"/><stop offset="1" stop-color="#8DB6FF"/></linearGradient></defs><rect x="0.5" y="0.5" width="479.0" height="398.0" rx="14" fill="url(#cardg)" stroke="#263049"/><rect x="20.0" y="0.2" width="288.0" height="2" rx="1" fill="url(#edge)"/><rect x="28" y="22" width="3" height="71" rx="1.5" fill="url(#accg)"/><text x="44" y="40.0" font-size="17.5" fill="#F5F7FB" font-weight="600" >날마다 봄, 나를 돌아봄. 거꾸로 읽으면 봄날.</text><text x="44" y="65.0" font-size="15" fill="#CDD4E1" font-style="italic" >챙겨야 할 날을 날마다 보고, 하루 한 줄로 나를 돌아보는</text><text x="44" y="87.0" font-size="15" fill="#CDD4E1" font-style="italic" >달력.</text><text x="28" y="133.0" font-size="16" fill="#CDD4E1" >날봄은 챙겨야 할 날, 캘린더, 하루 메모, 직장인 도구를</text><text x="28" y="157.0" font-size="16" fill="#CDD4E1" >한 앱에 담고 홈 화면과 잠금화면에 보여 줍니다. 아이폰,</text><text x="28" y="181.0" font-size="16" fill="#CDD4E1" >아이패드, 맥(Apple 실리콘), 안드로이드에서 쓸 수</text><text x="28" y="205.0" font-size="16" fill="#CDD4E1" >있어요.</text><line x1="28" y1="231" x2="452" y2="231" stroke="#263049"/><tex