<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="232" viewBox="0 0 1280 232" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', Arial, sans-serif"><defs><linearGradient id="cardg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F5F8FE"/></linearGradient><linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2160D4" stop-opacity="0"/><stop offset="0.25" stop-color="#2160D4" stop-opacity="0.9"/><stop offset="0.6" stop-color="#7C5CE0" stop-opacity="0.8"/><stop offset="1" stop-color="#7C5CE0" stop-opacity="0"/></linearGradient><linearGradient id="accg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2160D4"/><stop offset="1" stop-color="#7C5CE0"/></linearGradient><linearGradient id="inkg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0F172A"/><stop offset="0.7" stop-color="#0F172A"/><stop offset="1" stop-color="#2160D4"/></linearGradient></defs><rect x="0.5" y="0.5" width="1279.0" height="231.0" rx="14" fill="url(#cardg)" stroke="#DFE5F0"/><rect x="20.0" y="0.2" width="520.0" height="1.6" rx="0.8" fill="url(#edge)"/><rect x="32" y="26" width="3" height="52" rx="1.5" fill="url(#accg)"/><text x="50" y="46" font-size="18" font-weight="600" fill="#0F172A">날마다 봄, 나를 돌아봄. 거꾸로 읽으면 봄날.</text><text x="50" y="72" font-size="15.5" font-style="italic" fill="#3F4A5C">Seeing your days, looking back on yourself. Read backwards: bomnal, spring days.</text><text x="32" y="118" font-size="16" fill="#3F4A5C">Nalbom puts the dates you care about, your calendar, daily notes and everyday work tools into one app,</text><text x="32" y="144" font-size="16" fill="#3F4A5C">and shows them on the home screen and lock screen. iPhone, iPad, Mac (Apple silicon) and Android.</text><line x1="32" y1="166" x2="1248" y2="166" stroke="#DFE5F0"/><text x="32" y="199" font-family="'JetBrains Mono', 'SF Mono', ui